base: base.yaml

window:
  horizon: 12   # 60 min

features:
  insulin_carbs: false   # glucose only

# Same LSTM body as lstm_ph60.yaml; only the head and the loss differ.
model:
  type: lstm_quantile
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]

train:
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10       # early stopping on validation mean pinball loss (mg/dL)
  grad_clip: 1.0
