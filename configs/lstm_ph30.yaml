base: base.yaml

window:
  horizon: 6   # 30 min

features:
  insulin_carbs: false   # glucose-only run; step 5 flips this for the ablation

model:
  type: lstm
  hidden_size: 64
  num_layers: 2
  dropout: 0.2

train:
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10       # early stopping on validation RMSE (mg/dL)
  grad_clip: 1.0
